<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact · WisdomLabs</title>
    <meta name="description" content="Contact WisdomLabs at danielgu.contact@gmail.com.">
    <meta name="theme-color" content="#163a27">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bellefair&display=swap" rel="stylesheet">
    <link rel="preload" as="image" href="assets/bgImage1.jpg">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <!-- header -->
    <header class="site-header">
        <a class="wordmark" href="index.html" aria-label="WisdomLabs home">Wisdom<span>Labs</span></a>
        <nav class="site-nav" aria-label="Main">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="contact.html" aria-current="page">Contact</a></li>
                <li><a href="privacy.html">Privacy Policies</a></li>
            </ul>
        </nav>
    </header>

    <!-- body -->
    <main id="main">
        <div class="content">
            <h1>Contact</h1>
            <div class="divider" aria-hidden="true"></div>
            <p class="lede">For any inquiries, please feel free to contact</p>
            <a class="email" href="mailto:danielgu.contact@gmail.com">danielgu.contact@gmail.com</a>
            <div class="actions">
                <a class="btn btn-primary" href="mailto:danielgu.contact@gmail.com">Write an email</a>
                <button class="btn" type="button" id="copyEmail" data-email="danielgu.contact@gmail.com" hidden>Copy address</button>
            </div>
        </div>
    </main>

    <!-- footer -->
    <footer class="site-footer">
        <p>Contact: <a href="mailto:danielgu.contact@gmail.com">danielgu.contact@gmail.com</a></p>
        <p>Created by Daniel G. at WisdomLabs</p>
    </footer>

    <script>
        // Copy button only appears when the browser can actually copy
        (function () {
            var button = document.getElementById("copyEmail");
            if (!button || !navigator.clipboard) return;
            var label = button.textContent;
            button.hidden = false;
            button.addEventListener("click", function () {
                navigator.clipboard.writeText(button.dataset.email).then(function () {
                    button.textContent = "Copied";
                    setTimeout(function () { button.textContent = label; }, 1800);
                });
            });
        })();
    </script>
  </body>
</html>
